sonar.projectName=Desafio SEA
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Analisa as fixtures e os testes; docs, backups e ambiente virtual ficam fora.
sonar.sources=conftest.py
sonar.tests=tests
sonar.test.inclusions=**/*.py

# conftest.py contem somente fixtures, sem codigo de producao para medir cobertura.
# Esta exclusao afeta apenas cobertura; as fixtures continuam sendo analisadas.
sonar.coverage.exclusions=conftest.py

# O CI falha se o resultado nao atender aos criterios de qualidade do SonarQube.
sonar.qualitygate.wait=true
