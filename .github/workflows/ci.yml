name: CI - Analise Python

on:
  push:
    branches: [qa-sea]
  pull_request:
    branches: [qa-sea]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-codigo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-ci.txt

      - name: Analisar codigo com Ruff
        run: python -m ruff check conftest.py tests --output-format=github

      # A coleta carrega os testes sem executar fixtures nem acessar o site da SEA.
      - name: Verificar coleta dos testes com Pytest
        run: python -m pytest --collect-only -q
