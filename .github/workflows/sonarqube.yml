name: Analise estatica - SonarQube Cloud

on:
  push:
    branches: [codex/qa-sea]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Verificar configuracao do SonarQube
        shell: bash
        run: |
          for nome in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [[ -z "${!nome}" ]]; then
              echo "::error::Configure $nome em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Baixar codigo do repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analisar codigo e verificar Quality Gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
